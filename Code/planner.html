<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Floor-plan furniture planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f6f4ef; --panel: #fffdf8; --ink: #1e1e1c; --muted: #77746c; --line: #e4e0d6;
    --wall: #1e1e1c; --accent: #2f5d50; --bad: #c2412d; --warn: #c98a17; --ok: #2f5d50;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 330px; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 14px; margin: 0 12px 0 0; letter-spacing: .02em; }
  header .sep { flex: 1; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 6px;
    padding: 5px 10px; cursor: pointer; color: var(--ink); }
  button:hover, .btn:hover { border-color: #bdb8ab; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  input[type=file] { display: none; }
  #stage { position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: default; }
  #hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px;
    background: rgba(246,244,239,.85); padding: 4px 8px; border-radius: 6px; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; }
  #empty b { color: var(--ink); }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 12px 14px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 16px 0 6px; font-weight: 600; }
  aside h2:first-child { margin-top: 0; }
  .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .row label { width: 70px; color: var(--muted); }
  .row input { flex: 1; min-width: 0; font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; }
  .row input.num { width: 60px; flex: none; }
  #crop { width: 100%; border-radius: 6px; border: 1px solid var(--line); display: none; margin-top: 6px; }
  .flags { color: var(--warn); font-size: 12px; margin: 4px 0 0; padding-left: 16px; }
  .issues { font-size: 12px; margin: 4px 0; padding-left: 16px; }
  .issues .bad { color: var(--bad); } .issues .warn { color: var(--warn); }
  #list { list-style: none; padding: 0; margin: 0; }
  #list li { display: flex; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 5px; cursor: pointer; }
  #list li:hover { background: #f1ede4; } #list li.sel { background: #e6efe9; }
  #list .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  #list .lab { flex: 1; } #list .lab.none { color: var(--muted); font-style: italic; }
  #list .st { font-size: 11px; }
  .muted { color: var(--muted); }
  table.rooms { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.rooms td { padding: 3px 0; border-bottom: 1px solid var(--line); }
  table.rooms td.r { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; }
  .pill.bad { background: #f7ded9; color: var(--bad); } .pill.warn { background: #f7ecd4; color: #8a5d0b; }
  .pill.ok { background: #dfeee8; color: var(--ok); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Furniture planner</h1>
    <label class="btn" title="Pick the pano_<sid> (or interior_<sid>) output folder">Open output folder
      <input id="dir" type="file" webkitdirectory multiple></label>
    <label class="btn" title="Or pick plan.json, objects.json and crops/*.jpg">Open files
      <input id="files" type="file" multiple accept=".json,.jpg,.jpeg,.png"></label>
    <button id="demo">Load demo</button>
    <span class="sep"></span>
    <label class="muted">Walkway <input id="clear" type="number" value="0.6" min="0" step="0.1" style="width:52px"> m</label>
    <button id="undo" title="Ctrl+Z">Undo</button>
    <button id="fit">Fit</button>
    <button id="exportObj" class="primary">Export objects.json</button>
    <button id="exportLab">Export labels.json</button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="empty"><div><b>Open the pipeline's output folder</b><br>(the one with plan.json and objects.json)<br>or click <b>Load demo</b>.</div></div>
    <div id="hint">Drag to move · Q / E rotate 15° (Shift: 1°) · Del remove · D duplicate · drag empty space to pan · wheel to zoom</div>
  </div>
  <aside>
    <h2>Selected</h2>
    <div id="sel" class="muted">Click an object.</div>
    <h2>Objects <span id="summary"></span></h2>
    <ul id="list"></ul>
    <h2>Rooms</h2>
    <table class="rooms" id="rooms"></table>
  </aside>
</div>

<script>
"use strict";
// ---------------------------------------------------------------- state
const S = { plan: null, doc: null, objs: [], crops: {}, sel: null, undo: [],
            view: { cx: 0, cy: 0, scale: 60 }, issues: new Map() };
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const PALETTE = ["#4e79a7","#f28e2b","#59a14f","#b07aa1","#76b7b2","#edc948","#ff9da7","#9c755f","#e15759","#86bcb6"];
const labelColour = {};
function colourFor(o) {
  const k = (o.label || "?").toLowerCase();
  if (!(k in labelColour)) labelColour[k] = PALETTE[Object.keys(labelColour).length % PALETTE.length];
  return o.label ? labelColour[k] : "#9a968c";
}

// ---------------------------------------------------------------- geometry
function corners(o) {
  const [cx, cy] = o.box.centre, [L, W] = o.box.size_lwh_m, t = o.box.yaw_deg * Math.PI / 180;
  const ux = Math.cos(t), uy = Math.sin(t), vx = -uy, vy = ux;
  return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([a, b]) =>
    [cx + a * L / 2 * ux + b * W / 2 * vx, cy + a * L / 2 * uy + b * W / 2 * vy]);
}
function wallPoly(w) {
  const [ax, ay] = w.a, [bx, by] = w.b, dx = bx - ax, dy = by - ay, n = Math.hypot(dx, dy) || 1;
  const h = (w.thickness || 0.12) / 2, nx = -dy / n * h, ny = dx / n * h;
  return [[ax + nx, ay + ny], [bx + nx, by + ny], [bx - nx, by - ny], [ax - nx, ay - ny]];
}
function project(P, ax) { let lo = Infinity, hi = -Infinity;
  for (const p of P) { const d = p[0] * ax[0] + p[1] * ax[1]; lo = Math.min(lo, d); hi = Math.max(hi, d); } return [lo, hi]; }
function overlap(A, B) {           // separating-axis test for convex polygons, shrunk 1 cm to allow touching
  for (const P of [A, B]) for (let i = 0; i < P.length; i++) {
    const p = P[i], q = P[(i + 1) % P.length], n = Math.hypot(q[0] - p[0], q[1] - p[1]) || 1;
    const ax = [-(q[1] - p[1]) / n, (q[0] - p[0]) / n];
    const [a0, a1] = project(A, ax), [b0, b1] = project(B, ax);
    if (a1 <= b0 + 0.01 || b1 <= a0 + 0.01) return false;
  }
  return true;
}
function segDist(p, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L));
  return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy); }
function polyDist(A, B) { if (overlap(A, B)) return 0; let d = Infinity;
  for (const [P, Q] of [[A, B], [B, A]]) for (const p of P) for (let i = 0; i < Q.length; i++)
    d = Math.min(d, segDist(p, Q[i], Q[(i + 1) % Q.length])); return d; }
function inPoly(pt, poly) { let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) c = !c; }
  return c; }
function polyArea(P) { let a = 0; for (let i = 0; i < P.length; i++) { const p = P[i], q = P[(i + 1) % P.length];
  a += p[0] * q[1] - q[0] * p[1]; } return Math.abs(a) / 2; }
function roomAt(pt) { return (S.plan.rooms || []).find(r => inPoly(pt, r.polygon)) || null; }
function walls() { return (S.plan.walls || (S.plan.floors || []).flatMap(f => f.walls || [])).filter(w => w.physical !== false); }

// ---------------------------------------------------------------- checks
function check() {
  const clear = parseFloat($("clear").value) || 0, W = walls().map(wallPoly);
  S.issues = new Map(S.objs.map(o => [o, []]));
  const polys = new Map(S.objs.map(o => [o, corners(o)]));
  for (const o of S.objs) {
    const P = polys.get(o), r = roomAt(o.box.centre);
    o.room = r ? { id: r.id, label: r.label } : null;
    if (!r) S.issues.get(o).push(["bad", "outside every room"]);
    if (o.on_floor !== false && W.some(w => overlap(P, w))) S.issues.get(o).push(["bad", "goes through a wall"]);
  }
  for (let i = 0; i < S.objs.length; i++) for (let j = i + 1; j < S.objs.length; j++) {
    const a = S.objs[i], b = S.objs[j];
    if (a.on_floor === false || b.on_floor === false) continue;
    const d = polyDist(polys.get(a), polys.get(b)), na = name(a), nb = name(b);
    if (d === 0) { S.issues.get(a).push(["bad", `overlaps ${nb}`]); S.issues.get(b).push(["bad", `overlaps ${na}`]); }
    else if (d < clear) { S.issues.get(a).push(["warn", `${d.toFixed(2)} m from ${nb}`]);
                          S.issues.get(b).push(["warn", `${d.toFixed(2)} m from ${na}`]); }
  }
}
function status(o) { const is = S.issues.get(o) || [];
  return is.some(i => i[0] === "bad") ? "bad" : is.length ? "warn" : "ok"; }
function name(o) { return `#${o.id} ${o.label || "unlabelled"}`; }

// ---------------------------------------------------------------- drawing
function resize() { const r = cv.parentElement.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); draw(); }
function toScreen([x, y]) { const r = cv.getBoundingClientRect(), v = S.view;
  return [(x - v.cx) * v.scale + r.width / 2, r.height / 2 - (y - v.cy) * v.scale]; }
function toWorld(px, py) { const r = cv.getBoundingClientRect(), v = S.view;
  return [(px - r.width / 2) / v.scale + v.cx, (r.height / 2 - py) / v.scale + v.cy]; }
function path(P) { ctx.beginPath(); P.forEach((p, i) => { const [x, y] = toScreen(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); }
function draw() {
  const r = cv.getBoundingClientRect(); ctx.clearRect(0, 0, r.width, r.height);
  if (!S.plan) return;
  // grid (1 m)
  ctx.strokeStyle = "#ebe7dd"; ctx.lineWidth = 1;
  const [x0, y1] = toWorld(0, 0), [x1, y0] = toWorld(r.width, r.height);
  for (let x = Math.floor(x0); x <= x1; x++) { const [sx] = toScreen([x, 0]); ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, r.height); ctx.stroke(); }
  for (let y = Math.floor(y0); y <= y1; y++) { const [, sy] = toScreen([0, y]); ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(r.width, sy); ctx.stroke(); }
  // rooms
  for (const rm of S.plan.rooms || []) {
    path(rm.polygon); ctx.fillStyle = "rgba(255,253,248,.95)"; ctx.fill();
    const c = rm.polygon.reduce((a, p) => [a[0] + p[0] / rm.polygon.length, a[1] + p[1] / rm.polygon.length], [0, 0]);
    const [sx, sy] = toScreen(c); ctx.fillStyle = "#b3aea2"; ctx.font = "600 11px system-ui"; ctx.textAlign = "center";
    ctx.fillText(rm.label.toUpperCase(), sx, sy);
  }
  // walls
  for (const w of (S.plan.walls || (S.plan.floors || []).flatMap(f => f.walls || []))) {
    if (w.physical === false) { ctx.setLineDash([4, 4]); ctx.strokeStyle = "#c9c4b8"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(...toScreen(w.a)); ctx.lineTo(...toScreen(w.b)); ctx.stroke(); ctx.setLineDash([]); continue; }
    path(wallPoly(w)); ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--wall"); ctx.fill();
  }
  // objects
  const clear = parseFloat($("clear").value) || 0;
  for (const o of S.objs) {
    const P = corners(o), st = status(o), col = colourFor(o), sel = o === S.sel;
    if (sel && clear > 0 && o.on_floor !== false) {      // walkway halo
      ctx.save(); path(P); ctx.lineWidth = clear * 2 * S.view.scale; ctx.strokeStyle = "rgba(47,93,80,.08)";
      ctx.lineJoin = "round"; ctx.stroke(); ctx.restore(); }
    path(P); ctx.fillStyle = col + (sel ? "cc" : "88"); ctx.fill();
    ctx.lineWidth = sel ? 2.5 : 1.5;
    ctx.strokeStyle = st === "bad" ? "#c2412d" : st === "warn" ? "#c98a17" : col;
    if (o.on_floor === false) ctx.setLineDash([5, 3]);
    ctx.stroke(); ctx.setLineDash([]);
    // front marker (long side direction)
    const [sx, sy] = toScreen(o.box.centre);
    ctx.fillStyle = "#1e1e1c"; ctx.font = (sel ? "600 " : "") + "11px system-ui"; ctx.textAlign = "center";
    ctx.fillText(o.label || `#${o.id}`, sx, sy + 4);
  }
}

// ---------------------------------------------------------------- panel
function renderPanel() {
  check(); draw();
  const n = S.objs.length, bad = S.objs.filter(o => status(o) === "bad").length,
        warn = S.objs.filter(o => status(o) === "warn").length, unl = S.objs.filter(o => !o.label).length;
  $("summary").innerHTML = n ? `<span class="pill ${bad ? "bad" : "ok"}">${bad} conflicts</span> <span class="pill warn">${warn} tight</span> <span class="muted">${unl} unlabelled</span>` : "";
  const list = $("list"); list.innerHTML = "";
  for (const o of S.objs) {
    const li = document.createElement("li"); if (o === S.sel) li.className = "sel";
    const st = status(o);
    li.innerHTML = `<span class="sw" style="background:${colourFor(o)}"></span>
      <span class="lab ${o.label ? "" : "none"}">#${o.id} ${o.label || "unlabelled"}</span>
      <span class="st pill ${st}">${st === "ok" ? "ok" : st === "bad" ? "conflict" : "tight"}</span>`;
    li.onclick = () => { select(o); };
    list.appendChild(li);
  }
  // rooms
  const rows = (S.plan.rooms || []).map(rm => {
    const area = polyArea(rm.polygon), used = S.objs.filter(o => o.on_floor !== false && o.room && o.room.id === rm.id)
      .reduce((a, o) => a + o.box.size_lwh_m[0] * o.box.size_lwh_m[1], 0);
    return `<tr><td>${rm.label}</td><td class="r">${area.toFixed(1)} m²</td><td class="r muted">${area ? Math.round(100 * (1 - used / area)) : 0}% free</td></tr>`;
  });
  $("rooms").innerHTML = rows.join("");
  renderSel();
}
function renderSel() {
  const o = S.sel, box = $("sel");
  if (!o) { box.className = "muted"; box.textContent = "Click an object."; return; }
  box.className = "";
  const b = o.box, is = S.issues.get(o) || [], crop = S.crops[`obj_${String(o.id).padStart(3, "0")}.jpg`];
  box.innerHTML = `
    <div class="row"><label>Label</label><input id="fLabel" value="${(o.label || "").replace(/"/g, "&quot;")}" placeholder="e.g. sofa"></div>
    <div class="row"><label>Size (m)</label><input class="num" id="fL" type="number" step="0.05" value="${b.size_lwh_m[0]}">
      <input class="num" id="fW" type="number" step="0.05" value="${b.size_lwh_m[1]}"><input class="num" id="fH" type="number" step="0.05" value="${b.size_lwh_m[2]}"></div>
    <div class="row"><label>Rotation</label><input class="num" id="fYaw" type="number" step="1" value="${b.yaw_deg}"> <span class="muted">°</span></div>
    <div class="row"><label>Room</label><span>${o.room ? o.room.label : "—"}</span></div>
    <div class="row"><label>Position</label><span class="muted">${b.centre[0].toFixed(2)}, ${b.centre[1].toFixed(2)} m · ${o.on_floor === false ? "off the floor" : "on floor"}</span></div>
    ${o.seen_from_panos ? `<div class="row"><label>Seen from</label><span class="muted">pano ${o.seen_from_panos.join(", ")}</span></div>` : ""}
    ${is.length ? `<ul class="issues">${is.map(([k, t]) => `<li class="${k}">${t}</li>`).join("")}</ul>` : `<div class="row"><span class="pill ok">no conflicts</span></div>`}
    ${(o.flags || []).length ? `<ul class="flags">${o.flags.map(f => `<li>${f}</li>`).join("")}</ul>` : ""}
    <img id="crop" alt="crop">
    <div class="row" style="margin-top:8px"><button id="bDup">Duplicate</button><button id="bDel">Remove</button></div>`;
  if (crop) { $("crop").src = crop; $("crop").style.display = "block"; }
  const num = (id, fn) => $(id).onchange = e => { push(); fn(parseFloat(e.target.value) || 0); renderPanel(); };
  $("fLabel").onchange = e => { push(); o.label = e.target.value.trim() || null; o.label_source = "planner"; renderPanel(); };
  num("fL", v => b.size_lwh_m[0] = Math.max(0.05, v)); num("fW", v => b.size_lwh_m[1] = Math.max(0.05, v));
  num("fH", v => { b.size_lwh_m[2] = Math.max(0.02, v); b.z_top = +(b.z_bottom + b.size_lwh_m[2]).toFixed(2); });
  num("fYaw", v => b.yaw_deg = ((v % 360) + 360) % 360);
  $("bDup").onclick = duplicate; $("bDel").onclick = remove;
}
function select(o) { S.sel = o; renderPanel(); }

// ---------------------------------------------------------------- edits
function push() { S.undo.push(JSON.stringify(S.objs)); if (S.undo.length > 100) S.undo.shift(); }
function undo() { if (!S.undo.length) return; const selId = S.sel && S.sel.id;
  S.objs = JSON.parse(S.undo.pop()); S.sel = S.objs.find(o => o.id === selId) || null; renderPanel(); }
function nextId() { return S.objs.reduce((m, o) => Math.max(m, o.id), -1) + 1; }
function duplicate() { if (!S.sel) return; push(); const c = JSON.parse(JSON.stringify(S.sel));
  c.id = nextId(); c.box.centre[0] += 0.3; c.box.centre[1] -= 0.3; c.flags = ["added in planner"]; c.label_source = "planner";
  S.objs.push(c); select(c); }
function remove() { if (!S.sel) return; push(); S.objs = S.objs.filter(o => o !== S.sel); S.sel = null; renderPanel(); }
function rotate(deg) { if (!S.sel) return; push(); S.sel.box.yaw_deg = ((S.sel.box.yaw_deg + deg) % 360 + 360) % 360; renderPanel(); }

// ---------------------------------------------------------------- mouse
let drag = null;
function hit(w) { for (let i = S.objs.length - 1; i >= 0; i--) if (inPoly(w, corners(S.objs[i]))) return S.objs[i]; return null; }
cv.addEventListener("mousedown", e => {
  if (!S.plan) return;
  const w = toWorld(e.offsetX, e.offsetY), o = hit(w);
  if (o) { push(); S.sel = o; drag = { kind: "obj", o, dx: w[0] - o.box.centre[0], dy: w[1] - o.box.centre[1], moved: false }; renderPanel(); }
  else drag = { kind: "pan", x: e.offsetX, y: e.offsetY, cx: S.view.cx, cy: S.view.cy, moved: false };
});
cv.addEventListener("mousemove", e => {
  if (!drag) { if (S.plan) cv.style.cursor = hit(toWorld(e.offsetX, e.offsetY)) ? "move" : "grab"; return; }
  drag.moved = true;
  if (drag.kind === "obj") { const w = toWorld(e.offsetX, e.offsetY);
    drag.o.box.centre[0] = +(w[0] - drag.dx).toFixed(3); drag.o.box.centre[1] = +(w[1] - drag.dy).toFixed(3); check(); draw(); }
  else { S.view.cx = drag.cx - (e.offsetX - drag.x) / S.view.scale; S.view.cy = drag.cy + (e.offsetY - drag.y) / S.view.scale; draw(); }
});
addEventListener("mouseup", () => {
  if (!drag) return;
  if (drag.kind === "obj") { if (!drag.moved) S.undo.pop(); else drag.o.label_source = drag.o.label_source || "planner"; renderPanel(); }
  else if (!drag.moved && S.sel) { S.sel = null; renderPanel(); }
  drag = null;
});
cv.addEventListener("wheel", e => { e.preventDefault(); const w = toWorld(e.offsetX, e.offsetY), f = Math.exp(-e.deltaY * 0.0015);
  S.view.scale = Math.min(400, Math.max(8, S.view.scale * f));
  const w2 = toWorld(e.offsetX, e.offsetY); S.view.cx += w[0] - w2[0]; S.view.cy += w[1] - w2[1]; draw(); }, { passive: false });
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); return; }
  const step = e.shiftKey ? 1 : 15;
  if (e.key.toLowerCase() === "q") rotate(step); else if (e.key.toLowerCase() === "e") rotate(-step);
  else if (e.key === "Delete" || e.key === "Backspace") remove(); else if (e.key.toLowerCase() === "d") duplicate();
  else if (e.key === "Escape") { S.sel = null; renderPanel(); }
});

// ---------------------------------------------------------------- loading
function fit() {
  const pts = (S.plan.rooms || []).flatMap(r => r.polygon).concat(walls().flatMap(w => [w.a, w.b]));
  if (!pts.length) return;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), r = cv.getBoundingClientRect();
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  S.view = { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, scale: 0.88 * Math.min(r.width / (x1 - x0 || 1), r.height / (y1 - y0 || 1)) };
  draw();
}
function load(plan, doc, crops) {
  S.plan = plan; S.doc = doc; S.crops = crops || {}; S.undo = []; S.sel = null;
  S.objs = JSON.parse(JSON.stringify(doc.objects || []));
  for (const k in labelColour) delete labelColour[k];
  $("empty").style.display = "none"; fit(); renderPanel();
}
async function loadFiles(list) {
  const files = [...list], byName = n => files.find(f => f.name === n);
  const pf = byName("plan.json"), of = byName("objects.json");
  if (!pf || !of) { alert("Need plan.json and objects.json (the pipeline's output folder)."); return; }
  const plan = JSON.parse(await pf.text()), doc = JSON.parse(await of.text()), crops = {};
  const labelsF = byName("labels.json");
  if (labelsF) { const L = JSON.parse(await labelsF.text());
    for (const o of doc.objects) if (!o.label && L[String(o.id)]) o.label = L[String(o.id)]; }
  for (const f of files) if (/^obj_\d+\.jpe?g$/i.test(f.name)) crops[f.name] = URL.createObjectURL(f);
  load(plan, doc, crops);
}
$("dir").onchange = e => loadFiles(e.target.files);
$("files").onchange = e => loadFiles(e.target.files);
$("demo").onclick = () => { const d = JSON.parse($("demo-data").textContent); load(d.plan, d.objects, d.crops); };
$("fit").onclick = () => S.plan && fit();
$("undo").onclick = undo;
$("clear").oninput = () => S.plan && renderPanel();
function download(name, data) { const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" })); a.download = name; a.click(); }
$("exportObj").onclick = () => { if (!S.plan) return;
  download("objects.json", { ...S.doc, objects: S.objs.map(o => ({ ...o, planner_issues: (S.issues.get(o) || []).map(i => i[1]) })) }); };
$("exportLab").onclick = () => { if (!S.plan) return;
  download("labels.json", Object.fromEntries(S.objs.map(o => [String(o.id), o.label || ""]))); };
addEventListener("resize", resize);
resize();
</script>
</body>
</html>
