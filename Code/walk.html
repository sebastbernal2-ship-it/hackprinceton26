<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Walk-through v3</title>
<!-- Served by run_all.py at http://localhost:8000/Code/walk.html?model=<sid>  (needs assets_<sid>/walk/ from Code/walk_export.py) -->
<script src="showcase/config.js"></script>
<style>
  :root { --text:#e6e8eb; --dim:#9aa0a8; --acc:#4fa3ff; }
  html, body { margin:0; height:100%; overflow:hidden; background:#101114; color:var(--text); font:13px/1.45 system-ui, sans-serif; }
  canvas { display:block; }
  #hud { position:fixed; left:12px; top:12px; background:#000a; padding:8px 11px; border-radius:8px; max-width:360px; pointer-events:none; }
  #hud h1 { font-size:14px; margin:0 0 3px; } #hud .dim { color:var(--dim); font-size:12px; }
  kbd { background:#2a2f37; border:1px solid #3a3f48; border-radius:3px; padding:0 4px; font-size:11px; }
  #cross { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:#fff8; pointer-events:none; }
  #hint { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#000a; padding:6px 12px; border-radius:16px; font-size:12px; pointer-events:none; transition:opacity .3s; }
  #fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .25s; }
  #target { position:fixed; left:50%; top:calc(50% + 22px); transform:translateX(-50%); background:#000b; padding:4px 10px; border-radius:6px;
            font-size:12px; pointer-events:none; white-space:nowrap; transition:opacity .15s; }
  #target.bad { color:#ff8a8a; }
  #panel { position:fixed; right:12px; bottom:12px; background:#000a; padding:6px 8px; border-radius:8px; font-size:12px; color:var(--dim); }
  #panel button { background:#2a2f37; color:var(--text); border:1px solid #3a3f48; border-radius:5px; padding:3px 8px; margin-left:4px; cursor:pointer; font:inherit; }
  #panel button:hover { border-color:var(--acc); }
</style>
</head>
<body>
<div id="hud"><h1>Walk-through</h1>
  <div id="status" class="dim">Loading…</div>
  <div class="dim" style="margin-top:4px">Click to look around · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>Shift</kbd> run ·
    <kbd>N</kbd>/<kbd>B</kbd> next/previous scan spot · <kbd>P</kbd> photo view on/off · <kbd>Esc</kbd> free the mouse</div>
  <div class="dim" style="margin-top:4px">Furniture: aim at a piece · <kbd>E</kbd> or click pick up / place · wheel or <kbd>R</kbd> turn ·
    <kbd>X</kbd> remove · <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</div>
</div>
<div id="panel"><span id="edits"></span> <button id="exportBtn">Export edits.json</button><button id="resetBtn">Reset all</button></div>
<div id="cross"></div><div id="target" style="opacity:0"></div><div id="hint" style="opacity:0"></div><div id="fade"></div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';

// ------------------------------------------------------------------ settings
const Q = new URLSearchParams(location.search);
const SID = Q.get('model') || (window.HP_CONFIG && window.HP_CONFIG.model);
const BASE = `/assets_${SID}/walk/`;
const EYE = 1.6, RADIUS = 0.25, STEP = 0.45, WALK = 1.4, RUN = 3.0;
const SPHERES = [0.55, 1.0, 1.45];             // collision spheres, metres above the feet
const HI_BUDGET = Q.get('tex') === 'full' ? 1e9 : +(Q.get('hi') || 32);   // full-res textures kept near you
const PHOTO_DIST = 0.75, IDLE_S = 0.5;          // stop this close to a scan spot for this long -> photo view

const $ = id => document.getElementById(id);
const status = s => $('status').textContent = s;
const hint = s => { $('hint').textContent = s || ''; $('hint').style.opacity = s ? 1 : 0; };
if (!SID) { status('No model: open walk.html?model=<id> (or run run_all.py so showcase/config.js exists).'); throw new Error('no model'); }

// ------------------------------------------------------------------ renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const aniso = renderer.capabilities.getMaxAnisotropy();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x15171b);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 200); camera.up.set(0, 0, 1);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// ------------------------------------------------------------------ mesh
const meta = await (await fetch(BASE + 'meta.json')).json().catch(() => null);
if (!meta) { status(`Missing ${BASE}meta.json - run: python Code/walk_export.py --model ${SID}`); throw new Error('no meta'); }
status(`Loading mesh (${(meta.triangles / 1e3).toFixed(0)}k triangles)…`);
const buf = await (await fetch(BASE + 'mesh.bin')).arrayBuffer();
const P = new Float32Array(buf, meta.offsets.position, meta.vertices * 3);
const UV = new Float32Array(buf, meta.offsets.uv, meta.vertices * 2);
const IDX = new Uint32Array(buf, meta.offsets.index, meta.triangles * 3);
// one vertex buffer; the house and every movable piece are separate meshes (index ranges) over it
const posAttr = new THREE.BufferAttribute(P, 3), uvAttr = new THREE.BufferAttribute(UV, 2);
const mats = meta.textures.map(() => new THREE.MeshBasicMaterial({ color: 0x777777, side: THREE.DoubleSide }));
const span = gs => [Math.min(...gs.map(g => g.start)), Math.max(...gs.map(g => g.start + g.count))];
function subGeometry(gs) {
  const [lo, hi] = span(gs), g = new THREE.BufferGeometry();
  g.setAttribute('position', posAttr); g.setAttribute('uv', uvAttr);
  g.setIndex(new THREE.BufferAttribute(IDX.subarray(lo, hi), 1));
  for (const gr of gs) g.addGroup(gr.start - lo, gr.count, gr.tex);
  const b = new THREE.Box3();                      // bounds from this range only (the shared buffer holds everything)
  for (let k = lo; k < hi; k++) { const v = IDX[k] * 3; b.expandByPoint(new THREE.Vector3(P[v], P[v + 1], P[v + 2])); }
  g.boundingBox = b; g.boundingSphere = b.getBoundingSphere(new THREE.Sphere());

}
const HOUSE_END = meta.groups.length ? span(meta.groups)[1] : 0;    // index units; pieces follow the house
const house = new THREE.Mesh(subGeometry(meta.groups), mats); scene.add(house);

// texture level of detail: everything at half resolution, full resolution for the textures closest to you
const groups = meta.textures.map((tex, i) => ({ tex, i, lo: [Infinity, Infinity, Infinity], hi: [-Infinity, -Infinity, -Infinity], low: null, full: null }));
for (const g of [...meta.groups, ...(meta.pieces || []).flatMap(p => p.groups)]) {
  const t = groups[g.tex];
  for (let k = g.start; k < g.start + g.count; k++) { const v = IDX[k] * 3;
    for (let a = 0; a < 3; a++) { const x = P[v + a]; if (x < t.lo[a]) t.lo[a] = x; if (x > t.hi[a]) t.hi[a] = x; } }
}
// Decode off the main thread, already flipped and not premultiplied, so the GPU upload is a straight copy
// (a premultiplied bitmap makes WebGL convert every pixel on the main thread during the upload).
const RAW = { premultiplyAlpha: 'none', colorSpaceConversion: 'none' };
async function bitmap(url, half) {
  const b = await createImageBitmap(await (await fetch(url)).blob(), { ...RAW, imageOrientation: 'flipY' });
  if (!half) return b;
  const s = await createImageBitmap(b, { ...RAW, resizeWidth: Math.max(1, b.width >> 1), resizeHeight: Math.max(1, b.height >> 1), resizeQuality: 'high' });
  b.close(); return s;
}
const nextFrame = () => new Promise(r => requestAnimationFrame(r));
const wait = ms => new Promise(r => setTimeout(r, ms));
function texture(bmp) {
  const t = new THREE.Texture(bmp); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = aniso;
  t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter; t.needsUpdate = true; return t;
}
function setMap(g, t) { const m = mats[g.i]; m.map = t; m.color.set(0xffffff); m.needsUpdate = true; }
let loaded = 0;
const texJobs = groups.filter(g => g.tex);
await Promise.all(Array.from({ length: 6 }, async () => {
  while (texJobs.length) { const g = texJobs.shift();
    try { g.low = texture(await bitmap(meta.texture_dir + g.tex, true)); setMap(g, g.low); } catch (e) { console.warn(g.tex, e); }
    status(`Loading textures ${++loaded}/${groups.length}…`); }
}));
const boxDist = (g, p) => Math.hypot(Math.max(g.lo[0] - p.x, 0, p.x - g.hi[0]), Math.max(g.lo[1] - p.y, 0, p.y - g.hi[1]), Math.max(g.lo[2] - p.z, 0, p.z - g.hi[2]));

// pixels in background workers, then copy them into an empty texture 128 rows per frame (~1 ms each); mipmaps are
// built once on the GPU after the last strip.
const decoders = Array.from({ length: 2 }, () => new Worker(URL.createObjectURL(new Blob([`
  onmessage = async e => {
    const { id, url } = e.data;
    try {
      const b = await createImageBitmap(await (await fetch(url)).blob());
      const W = b.width, H = b.height, oc = new OffscreenCanvas(W, H), cx = oc.getContext('2d', { willReadFrequently: true });
      cx.drawImage(b, 0, 0); b.close();
      const px = cx.getImageData(0, 0, W, H).data, out = new Uint8Array(W * H * 4), row = W * 4;
      for (let y = 0; y < H; y++) out.set(px.subarray((H - 1 - y) * row, (H - y) * row), y * row);   // WebGL rows run bottom-up
      postMessage({ id, W, H, data: out }, [out.buffer]);
    } catch (err) { postMessage({ id, error: String(err) }); }
  };`], { type: 'text/javascript' }))));
const decodeJobs = new Map(); let decodeId = 0, nextDecoder = 0;
decoders.forEach(w => w.onmessage = e => { decodeJobs.get(e.data.id)(e.data); decodeJobs.delete(e.data.id); });
function decode(url) {
  const id = ++decodeId, w = decoders[nextDecoder++ % decoders.length];
  return new Promise((res, rej) => { decodeJobs.set(id, d => d.error ? rej(new Error(d.error)) : res(d));
    w.postMessage({ id, url: new URL(url, location.href).href }); });
}
const STRIP = 128;
async function stripUpload(url, wrap) {

  const dst = new THREE.DataTexture(null, W, H, THREE.RGBAFormat, THREE.UnsignedByteType);
  dst.colorSpace = THREE.SRGBColorSpace; dst.anisotropy = aniso; dst.flipY = false;
  if (wrap) dst.wrapS = THREE.RepeatWrapping;
  dst.minFilter = THREE.LinearMipmapLinearFilter; dst.magFilter = THREE.LinearFilter; dst.generateMipmaps = true;
  dst.source.dataReady = false; dst.needsUpdate = true;      // allocate storage (with mip levels) but send no pixels yet
  await nextFrame(); renderer.initTexture(dst);
  dst.generateMipmaps = false;
  const region = new THREE.Box2(new THREE.Vector2(), new THREE.Vector2()), at = new THREE.Vector2();
  for (let y = 0; y < H; y += STRIP) {
    await nextFrame();
    const h = Math.min(STRIP, H - y);
    if (y + h >= H) dst.generateMipmaps = true;
    region.min.set(0, y); region.max.set(W, y + h);
    renderer.copyTextureToTexture(src, dst, region, at.set(0, y));
  }
  return dst;
}
// Upgrades are paced (one GPU upload, then a pause) and sticky (a texture only drops back to half resolution once it is
// well outside the nearest set), so walking along the edge of the set does not keep re-uploading the same textures.
let lodBusy = false;
async function updateLOD() {
  if (lodBusy) return; lodBusy = true;
  try {
    const ranked = groups.filter(g => g.tex && isFinite(g.lo[0])).sort((a, b) => boxDist(a, camera.position) - boxDist(b, camera.position));
    const rank = new Map(ranked.map((g, i) => [g, i]));
    for (const g of groups) if (g.full && rank.get(g) >= HI_BUDGET * 1.25) {
      setMap(g, g.low); g.full.dispose(); g.full = null; }
    for (const g of ranked.slice(0, HI_BUDGET)) {
      if (g.full) continue;
      let t;
      try { t = await stripUpload(meta.texture_dir + g.tex); } catch (e) { console.warn(g.tex, e); continue; }
      g.full = t; setMap(g, t);
      await wait(50);
    }
  } finally { lodBusy = false; }
}

// ------------------------------------------------------------------ collision
// A "soup" is a set of triangles bucketed into XY cells. The house is one (plus the floor of the fill patches, so you
// can walk where a piece used to stand); every movable piece has its own, queried in the piece's original frame.
function makeSoup(Pos, Ix, cell) {
  const n = Ix.length / 3, nz = new Float32Array(n);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let k = 0; k < Ix.length; k++) { const v = Ix[k] * 3;
    if (Pos[v] < x0) x0 = Pos[v]; if (Pos[v] > x1) x1 = Pos[v]; if (Pos[v + 1] < y0) y0 = Pos[v + 1]; if (Pos[v + 1] > y1) y1 = Pos[v + 1]; }
  x0 -= cell; y0 -= cell;
  const nx = Math.max(1, Math.ceil((x1 - x0) / cell) + 1), ny = Math.max(1, Math.ceil((y1 - y0) / cell) + 1);
  const start = new Uint32Array(nx * ny + 1);
  const range = t => { const a = Ix[t * 3] * 3, b = Ix[t * 3 + 1] * 3, c = Ix[t * 3 + 2] * 3;
    return [Math.floor((Math.min(Pos[a], Pos[b], Pos[c]) - x0) / cell), Math.floor((Math.max(Pos[a], Pos[b], Pos[c]) - x0) / cell),
            Math.floor((Math.min(Pos[a + 1], Pos[b + 1], Pos[c + 1]) - y0) / cell), Math.floor((Math.max(Pos[a + 1], Pos[b + 1], Pos[c + 1]) - y0) / cell)]; };
  for (let t = 0; t < n; t++) {
    const a = Ix[t * 3] * 3, b = Ix[t * 3 + 1] * 3, c = Ix[t * 3 + 2] * 3;
    const ux = Pos[b] - Pos[a], uy = Pos[b + 1] - Pos[a + 1], uz = Pos[b + 2] - Pos[a + 2], vx = Pos[c] - Pos[a], vy = Pos[c + 1] - Pos[a + 1], vz = Pos[c + 2] - Pos[a + 2];
    const qx = uy * vz - uz * vy, qy = uz * vx - ux * vz, qz = ux * vy - uy * vx;
    nz[t] = Math.abs(qz) / (Math.hypot(qx, qy, qz) || 1);
    const [i0, i1, j0, j1] = range(t);
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) start[j * nx + i + 1]++;
  }
  for (let k = 0; k < nx * ny; k++) start[k + 1] += start[k];
  const tris = new Uint32Array(start[nx * ny]), fillAt = start.slice(0, nx * ny);
  for (let t = 0; t < n; t++) { const [i0, i1, j0, j1] = range(t);
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) tris[fillAt[j * nx + i]++] = t; }
  return { Pos, Ix, n, nz, cell, x0, y0, nx, ny, start, tris, stamp: new Uint32Array(n), sid: 0 };
}
function eachTri(S, xmin, xmax, ymin, ymax, fn) {
  S.sid++;
  const i0 = Math.max(0, Math.floor((xmin - S.x0) / S.cell)), i1 = Math.min(S.nx - 1, Math.floor((xmax - S.x0) / S.cell));
  const j0 = Math.max(0, Math.floor((ymin - S.y0) / S.cell)), j1 = Math.min(S.ny - 1, Math.floor((ymax - S.y0) / S.cell));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++)
    for (let k = S.start[j * S.nx + i], e = S.start[j * S.nx + i + 1]; k < e; k++) {
      const t = S.tris[k]; if (S.stamp[t] === S.sid) continue; S.stamp[t] = S.sid; fn(t); }
}

// the house soup: house triangles + floor-like fill triangles
const patchN = meta.patch ? meta.patch.vertices : 0, patchT = meta.patch ? meta.patch.triangles : 0;
const PP = patchN ? new Float32Array(buf, meta.offsets.patch_position, patchN * 3) : new Float32Array(0);
const PI_ = patchT ? new Uint32Array(buf, meta.offsets.patch_index, patchT * 3) : new Uint32Array(0);
const nV = meta.vertices;
const CP = new Float32Array(P.length + PP.length); CP.set(P); CP.set(PP, P.length);
const floorFill = [];
for (let t = 0; t < patchT; t++) {
  const a = PI_[t * 3] * 3, b = PI_[t * 3 + 1] * 3, c = PI_[t * 3 + 2] * 3;
  const ux = PP[b] - PP[a], uy = PP[b + 1] - PP[a + 1], uz = PP[b + 2] - PP[a + 2], vx = PP[c] - PP[a], vy = PP[c + 1] - PP[a + 1], vz = PP[c + 2] - PP[a + 2];
  const qx = uy * vz - uz * vy, qy = uz * vx - ux * vz, qz = ux * vy - uy * vx;
  if (Math.abs(qz) >= 0.6 * Math.hypot(qx, qy, qz)) floorFill.push(t);
}
const CI = new Uint32Array(HOUSE_END + floorFill.length * 3); CI.set(IDX.subarray(0, HOUSE_END));
floorFill.forEach((t, k) => { for (let a = 0; a < 3; a++) CI[HOUSE_END + k * 3 + a] = PI_[t * 3 + a] + nV; });
const STATIC = makeSoup(CP, CI, 0.5);

// highest floor-like surface under (x, y) between zBot and zTop, or -Infinity
function floorAt(x, y, zTop, zBot) {
  const S = STATIC, Pos = S.Pos, Ix = S.Ix;
  let best = -Infinity;
  eachTri(S, x, x, y, y, t => {
    if (S.nz[t] < 0.6) return;
    const a = Ix[t * 3] * 3, b = Ix[t * 3 + 1] * 3, c = Ix[t * 3 + 2] * 3;
    const d = (Pos[b + 1] - Pos[c + 1]) * (Pos[a] - Pos[c]) + (Pos[c] - Pos[b]) * (Pos[a + 1] - Pos[c + 1]); if (Math.abs(d) < 1e-12) return;
    const l1 = ((Pos[b + 1] - Pos[c + 1]) * (x - Pos[c]) + (Pos[c] - Pos[b]) * (y - Pos[c + 1])) / d;
    const l2 = ((Pos[c + 1] - Pos[a + 1]) * (x - Pos[c]) + (Pos[a] - Pos[c]) * (y - Pos[c + 1])) / d, l3 = 1 - l1 - l2;
    if (l1 < -1e-6 || l2 < -1e-6 || l3 < -1e-6) return;

}
// floor under a small disc (bridges the scan's pinholes)
function groundAt(x, y, zTop, zBot) {

  if (vb <= 0 && d2 >= 0 && d6 <= 0) { const w = d2 / (d2 - d6); return set(out, ax + w * acx, ay + w * acy, az + w * acz); }

function set(o, x, y, z) { o[0] = x; o[1] = y; o[2] = z; return o; }
const tmp = [0, 0, 0];
// horizontal push that takes a sphere at (x, y, z) out of the triangles of S (in S's own frame)
function sphereOut(S, x, y, z, r) {
  let px = 0, py = 0;
  eachTri(S, x - r, x + r, y - r, y + r, t => {
    closest(S, x + px, y + py, z, t, tmp);
    const dx = x + px - tmp[0], dy = y + py - tmp[1], dz = z - tmp[2], d = Math.hypot(dx, dy, dz);
    if (d >= r) return;

    const k = Math.min(r - d, 0.2) / hl; px += dx * k; py += dy * k;

// push the player's body spheres horizontally out of walls and furniture (furniture wherever it has been moved to)
function pushOut(feet) {
  for (let it = 0; it < 4; it++) {

    for (let k = q.lo; k < q.hi && hits <= 12; k += 3) {           // every triangle's first corner, in q's current pose
      const v = IDX[k] * 3, dx = P[v] - q.cx, dy = P[v + 1] - q.cy;
      if (inFootprint(pc, q.cx + q.tx + dx * c - dy * s, q.cy + q.ty + dx * s + dy * c, P[v + 2] + q.dz)) hits++;
    }
  }
  return hits <= 12;
}
let wheel = 0;
function updateFurniture(dt) {
  if (carried) {
    const pc = carried;
    const tx = feet.x + Math.cos(yaw) * carry.hold - pc.cx, ty = feet.y + Math.sin(yaw) * carry.hold - pc.cy;
    const k = 1 - Math.exp(-dt * 14);
    pc.tx += (tx - pc.tx) * k; pc.ty += (ty - pc.ty) * k;
    if (wheel) { pc.dyaw += wheel * Math.PI / 12; wheel = 0; }
    if (pc.on_floor) {                                             // rest on whatever floor is under it
      const g = groundAt(pc.cx + pc.tx, pc.cy + pc.ty, pc.floor_z + pc.dz + 0.5, pc.floor_z + pc.dz - 1.5);
      if (isFinite(g)) pc.dz += (g - pc.floor_z - pc.dz) * k;
    }
    applyPose(pc);
    if ((fitTimer += dt) > 0.12) { fitTimer = 0; fits = checkFit(pc); outlineMat.color.set(fits ? 0x3ecf8e : 0xff5d5d); }
    $('target').textContent = fits ? `Carrying ${pc.label} - E or click to place · wheel / R to turn · X remove · Esc put back`
                                   : `${pc.label} doesn't fit here · Shift+E to place anyway · Esc put back`;
    $('target').className = fits ? '' : 'bad';
  } else {
    wheel = 0;
    setTarget(mode === 'walk' ? aim() : null);
    $('target').textContent = target ? `${target.label}${target.room ? ' · ' + target.room : ''} - E or click to pick up · X remove` : '';
    $('target').className = '';
  }
  $('target').style.opacity = $('target').textContent ? 1 : 0;
}
let flashTimer = 0;
function flash(s) { hint(s); flashTimer = 2.2; }
const editedNear = s => pieces.some(pc => isEdited(pc) && Math.hypot(pc.cx + pc.tx - s.pos.x, pc.cy + pc.ty - s.pos.y) < 12 && Math.abs(pc.floor_z - (s.pos.z - 1.3)) < 2);

addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'KeyE') interact(e.shiftKey);
  else if (e.code === 'KeyX' || e.code === 'Delete') removePiece(carried || target);
  else if (e.code === 'KeyR' && carried) { carried.dyaw += Math.PI / 2; applyPose(carried); }
  else if (e.code === 'KeyZ' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); }
  else if (e.code === 'Escape') cancelCarry();
});
addEventListener('wheel', e => { if (carried) { wheel += Math.sign(e.deltaY); e.preventDefault(); } }, { passive: false });
$('exportBtn').onclick = exportEdits;
$('resetBtn').onclick = () => { if (!confirm('Put every piece back where it was scanned?')) return;
  for (const pc of pieces) if (isEdited(pc)) { pushUndo(pc); setPose(pc, { tx: 0, ty: 0, dz: 0, dyaw: 0, deleted: false }); }
  save(); };
save();

// ------------------------------------------------------------------ loop
const clock = new THREE.Clock();
let lodTimer = 0, prefetchTimer = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const fwd = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
  const side = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  const moving = fwd || side;
  if (moving && mode !== 'walk') leavePhoto();

  if (mode === 'walk') {
    const sp = keys.has('ShiftLeft') || keys.has('ShiftRight') ? RUN : WALK;
    let wx = 0, wy = 0;
    if (moving) { const l = Math.hypot(fwd, side); const f = fwd / l, s = side / l;
      wx = (Math.cos(yaw) * f + Math.sin(yaw) * s) * sp; wy = (Math.sin(yaw) * f - Math.cos(yaw) * s) * sp; }
    const k = 1 - Math.exp(-dt * (moving ? 9 : 12));
    vel.x += (wx - vel.x) * k; vel.y += (wy - vel.y) * k;
    const steps = Math.max(1, Math.ceil(Math.hypot(vel.x, vel.y) * dt / 0.08));
    for (let i = 0; i < steps; i++) {
      const ox = feet.x, oy = feet.y;
      feet.x += vel.x * dt / steps; feet.y += vel.y * dt / steps;
      pushOut(feet);
      const g = groundAt(feet.x, feet.y, feet.z + STEP, feet.z - 3);
      if (!isFinite(g)) { feet.x = ox; feet.y = oy; vel.multiplyScalar(0.5); continue; }   // no floor there (hole / outside)
      if (g >= feet.z - 0.02) { feet.z = g; vz = 0; }                                      // flat or a step up
      else { vz -= 9.8 * dt / steps; feet.z = Math.max(g, feet.z + vz * dt / steps); if (feet.z === g) vz = 0; }
    }
    const target = new THREE.Vector3(feet.x, feet.y, feet.z + EYE);
    eye.x = target.x; eye.y = target.y; eye.z += (target.z - eye.z) * (1 - Math.exp(-dt * 10));   // stairs feel smooth
    idle = moving || Math.hypot(vel.x, vel.y) > 0.05 ? 0 : idle + dt;

    if (autoPhoto && idle > IDLE_S && !carried) {
      const s = nearestSpot(PHOTO_DIST);
      if (s && s.tex && s.align && !editedNear(s)) {         // the photo would show the old layout mode = 'glide'; active = s; glide = { from: eye.clone(), t: 0 };
        photoMat.uniforms.pano.value = s.tex; photoMat.uniforms.ym.value.set(s.align.yaw, s.align.mirror); }
    }
  } else if (mode === 'glide' || mode === 'photo') {
    glide.t = Math.min(1, glide.t + dt / 0.6);
    const e = glide.t * glide.t * (3 - 2 * glide.t);
    eye.lerpVectors(glide.from, active.pos, e);
    if (glide.t >= 1) mode = 'photo';
  }
  // photo cross-fade
  fadeT = mode === 'photo' ? Math.min(1, fadeT + dt / 0.5) : Math.max(0, fadeT - dt / 0.25);
  photo.visible = fadeT > 0; photoMat.uniforms.opacity.value = fadeT; if (active) photo.position.copy(active.pos);
  if (mode === 'walk' && fadeT === 0) active = null;

  camera.position.copy(eye);
  camera.lookAt(eye.x + Math.cos(pitch) * Math.cos(yaw), eye.y + Math.cos(pitch) * Math.sin(yaw), eye.z + Math.sin(pitch));
  updateFurniture(dt);
  renderer.render(scene, camera);
  if (flashTimer > 0 && (flashTimer -= dt) <= 0) hint('');

  lodTimer += dt; if (lodTimer > 1) { lodTimer = 0; updateLOD(); }
  prefetchTimer += dt;
  if (prefetchTimer > 0.5) { prefetchTimer = 0;
    const s = autoPhoto && nearestSpot(2.5); if (s && !s.loading) prepareSpot(s);
    const near = nearestSpot(PHOTO_DIST);
    status(`${mode === 'photo' ? 'Photo at scan spot ' + active.label : 'Walking'} · ${spots.length} scan spots` +
      (near && !near.tex ? ' · loading photo…' : '') + (near && near.tex && !near.align ? ' · this photo could not be lined up' : ''));
    if (flashTimer <= 0) hint(mode === 'photo' ? 'Real photo - move to keep walking' :
      (near && autoPhoto && near.tex && near.align && idle < IDLE_S && !moving && !carried && !editedNear(near) ? 'Stand still to see the photo' : ''));
  }
  requestAnimationFrame(frame);
}
status(`Ready · ${spots.length} scan spots`);
window.walk = { feet, eye, spots, groups, renderer, pieces, interact, removePiece, undo, get target() { return target; },
  get carried() { return carried; }, get fits() { return fits; }, get mode() { return mode; }, setView(y, p) { yaw = y; pitch = p; }, keys };   // for debugging
frame();
</script>
</body>
</html>
