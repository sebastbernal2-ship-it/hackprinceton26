<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Walk-through v1</title>
<!-- Served by run_all.py at http://localhost:8000/modeling/walk.html?model=<sid>  (needs assets_<sid>/walk/ from modeling/walk_export.py) -->
<script src="showcase/config.js"></script>
<style>
  :root { --text:#e6e8eb; --dim:#9aa0a8; --acc:#4fa3ff; }
  html, body { margin:0; height:100%; overflow:hidden; background:#101114; color:var(--text); font:13px/1.45 system-ui, sans-serif; }
  canvas { display:block; }
  #hud { position:fixed; left:12px; top:12px; background:#000a; padding:8px 11px; border-radius:8px; max-width:360px; pointer-events:none; }
  #hud h1 { font-size:14px; margin:0 0 3px; } #hud .dim { color:var(--dim); font-size:12px; }
  kbd { background:#2a2f37; border:1px solid #3a3f48; border-radius:3px; padding:0 4px; font-size:11px; }
  #cross { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:#fff8; pointer-events:none; }
  #hint { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#000a; padding:6px 12px; border-radius:16px; font-size:12px; pointer-events:none; transition:opacity .3s; }
  #fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .25s; }
</style>
</head>
<body>
<div id="hud"><h1>Walk-through</h1>
  <div id="status" class="dim">Loading…</div>
  <div class="dim" style="margin-top:4px">Click to look around · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>Shift</kbd> run ·
    <kbd>N</kbd>/<kbd>B</kbd> next/previous scan spot · <kbd>P</kbd> photo view on/off · <kbd>Esc</kbd> free the mouse</div>
</div>
<div id="cross"></div><div id="hint" style="opacity:0"></div><div id="fade"></div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';

// ------------------------------------------------------------------ settings
const Q = new URLSearchParams(location.search);
const SID = Q.get('model') || (window.HP_CONFIG && window.HP_CONFIG.model);
const BASE = `/assets_${SID}/walk/`;
const EYE = 1.6, RADIUS = 0.25, STEP = 0.45, WALK = 1.4, RUN = 3.0;
const SPHERES = [0.55, 1.0, 1.45];             // collision spheres, metres above the feet
const HI_BUDGET = Q.get('tex') === 'full' ? 1e9 : +(Q.get('hi') || 32);   // full-res textures kept near you
const PHOTO_DIST = 0.75, IDLE_S = 0.5;          // stop this close to a scan spot for this long -> photo view

const $ = id => document.getElementById(id);
const status = s => $('status').textContent = s;
const hint = s => { $('hint').textContent = s || ''; $('hint').style.opacity = s ? 1 : 0; };
if (!SID) { status('No model: open walk.html?model=<id> (or run run_all.py so showcase/config.js exists).'); throw new Error('no model'); }

// ------------------------------------------------------------------ renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const aniso = renderer.capabilities.getMaxAnisotropy();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x15171b);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 200); camera.up.set(0, 0, 1);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// ------------------------------------------------------------------ mesh
const meta = await (await fetch(BASE + 'meta.json')).json().catch(() => null);
if (!meta) { status(`Missing ${BASE}meta.json - run: python modeling/walk_export.py --model ${SID}`); throw new Error('no meta'); }
status(`Loading mesh (${(meta.triangles / 1e3).toFixed(0)}k triangles)…`);
const buf = await (await fetch(BASE + 'mesh.bin')).arrayBuffer();
const P = new Float32Array(buf, meta.offsets.position, meta.vertices * 3);
const UV = new Float32Array(buf, meta.offsets.uv, meta.vertices * 2);
const IDX = new Uint32Array(buf, meta.offsets.index, meta.triangles * 3);
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(P, 3));
geo.setAttribute('uv', new THREE.BufferAttribute(UV, 2));
geo.setIndex(new THREE.BufferAttribute(IDX, 1));
geo.computeBoundingSphere();
const blank = new THREE.MeshBasicMaterial({ color: 0x777777, side: THREE.DoubleSide });
const mats = meta.groups.map((g, i) => { geo.addGroup(g.start, g.count, i); return g.tex ? new THREE.MeshBasicMaterial({ color: 0x777777, side: THREE.DoubleSide }) : blank; });
const mesh = new THREE.Mesh(geo, mats); scene.add(mesh);

// texture level of detail: everything at half resolution, full resolution for the groups closest to you
const groups = meta.groups.map((g, i) => {
  const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  for (let k = g.start; k < g.start + g.count; k++) { const v = IDX[k] * 3;
    for (let a = 0; a < 3; a++) { const x = P[v + a]; if (x < lo[a]) lo[a] = x; if (x > hi[a]) hi[a] = x; } }
  return { ...g, i, lo, hi, low: null, full: null, busy: false };
});
// Decode off the main thread, already flipped and not premultiplied, so the GPU upload is a straight copy
// (a premultiplied bitmap makes WebGL convert every pixel on the main thread during the upload).
const RAW = { premultiplyAlpha: 'none', colorSpaceConversion: 'none' };
async function bitmap(url, half) {
  const b = await createImageBitmap(await (await fetch(url)).blob(), { ...RAW, imageOrientation: 'flipY' });
  if (!half) return b;
  const s = await createImageBitmap(b, { ...RAW, resizeWidth: Math.max(1, b.width >> 1), resizeHeight: Math.max(1, b.height >> 1), resizeQuality: 'high' });
  b.close(); return s;
}
const nextFrame = () => new Promise(r => requestAnimationFrame(r));
const wait = ms => new Promise(r => setTimeout(r, ms));
function texture(bmp) {
  const t = new THREE.Texture(bmp); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = aniso;
  t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter; t.needsUpdate = true; return t;
}
function setMap(g, t) { const m = mats[g.i]; m.map = t; m.color.set(0xffffff); m.needsUpdate = true; }
let loaded = 0;
const texJobs = groups.filter(g => g.tex);
await Promise.all(Array.from({ length: 6 }, async () => {
  while (texJobs.length) { const g = texJobs.shift();
    try { g.low = texture(await bitmap(meta.texture_dir + g.tex, true)); setMap(g, g.low); } catch (e) { console.warn(g.tex, e); }
    status(`Loading textures ${++loaded}/${groups.length}…`); }
}));
const boxDist = (g, p) => Math.hypot(Math.max(g.lo[0] - p.x, 0, p.x - g.hi[0]), Math.max(g.lo[1] - p.y, 0, p.y - g.hi[1]), Math.max(g.lo[2] - p.z, 0, p.z - g.hi[2]));
// Upgrades are paced (one GPU upload, then a pause) and sticky (a texture only drops back to half resolution once it is
// well outside the nearest set), so walking along the edge of the set does not keep re-uploading the same textures.
let lodBusy = false;
async function updateLOD() {
  if (lodBusy) return; lodBusy = true;
  try {
    const ranked = groups.filter(g => g.tex).sort((a, b) => boxDist(a, camera.position) - boxDist(b, camera.position));
    const rank = new Map(ranked.map((g, i) => [g, i]));
    for (const g of groups) if (g.full && rank.get(g) >= HI_BUDGET * 1.25) {
      setMap(g, g.low); g.full.dispose(); g.full.image.close?.(); g.full = null; }
    for (const g of ranked.slice(0, HI_BUDGET)) {
      if (g.full) continue;
      let t;
      try { t = texture(await bitmap(meta.texture_dir + g.tex, false)); } catch (e) { continue; }
      await nextFrame();
      renderer.initTexture(t);                    // upload now, between frames, instead of in the middle of a draw
      g.full = t; setMap(g, t);
      await wait(150);
    }
  } finally { lodBusy = false; }
}

// ------------------------------------------------------------------ collision grid (triangles bucketed into 0.5 m XY cells)
const NT = meta.triangles, CELL = 0.5;
const X0 = meta.bbox[0][0] - 1, Y0 = meta.bbox[0][1] - 1;
const NX = Math.ceil((meta.bbox[1][0] - X0 + 1) / CELL), NY = Math.ceil((meta.bbox[1][1] - Y0 + 1) / CELL);
const NZ = new Float32Array(NT);                // |normal.z| of each triangle (1 = floor-like)
const cellStart = new Uint32Array(NX * NY + 1);
const triRange = t => { const a = IDX[t * 3] * 3, b = IDX[t * 3 + 1] * 3, c = IDX[t * 3 + 2] * 3;
  return [Math.floor((Math.min(P[a], P[b], P[c]) - X0) / CELL), Math.floor((Math.max(P[a], P[b], P[c]) - X0) / CELL),
          Math.floor((Math.min(P[a + 1], P[b + 1], P[c + 1]) - Y0) / CELL), Math.floor((Math.max(P[a + 1], P[b + 1], P[c + 1]) - Y0) / CELL)]; };
for (let t = 0; t < NT; t++) {
  const a = IDX[t * 3] * 3, b = IDX[t * 3 + 1] * 3, c = IDX[t * 3 + 2] * 3;
  const ux = P[b] - P[a], uy = P[b + 1] - P[a + 1], uz = P[b + 2] - P[a + 2], vx = P[c] - P[a], vy = P[c + 1] - P[a + 1], vz = P[c + 2] - P[a + 2];
  const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  NZ[t] = Math.abs(nz) / (Math.hypot(nx, ny, nz) || 1);
  const [i0, i1, j0, j1] = triRange(t);
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) cellStart[j * NX + i + 1]++;
}
for (let k = 0; k < NX * NY; k++) cellStart[k + 1] += cellStart[k];
const cellTris = new Uint32Array(cellStart[NX * NY]), fill = cellStart.slice(0, NX * NY);
for (let t = 0; t < NT; t++) { const [i0, i1, j0, j1] = triRange(t);
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) cellTris[fill[j * NX + i]++] = t; }
const stamp = new Uint32Array(NT); let stampId = 0;
function eachTri(xmin, xmax, ymin, ymax, fn) {
  stampId++;
  const i0 = Math.max(0, Math.floor((xmin - X0) / CELL)), i1 = Math.min(NX - 1, Math.floor((xmax - X0) / CELL));
  const j0 = Math.max(0, Math.floor((ymin - Y0) / CELL)), j1 = Math.min(NY - 1, Math.floor((ymax - Y0) / CELL));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++)
    for (let k = cellStart[j * NX + i], e = cellStart[j * NX + i + 1]; k < e; k++) {
      const t = cellTris[k]; if (stamp[t] === stampId) continue; stamp[t] = stampId; fn(t); }
}
// highest floor-like surface under (x, y) between zBot and zTop, or -Infinity
function floorAt(x, y, zTop, zBot) {
  let best = -Infinity;
  eachTri(x, x, y, y, t => {
    if (NZ[t] < 0.6) return;
    const a = IDX[t * 3] * 3, b = IDX[t * 3 + 1] * 3, c = IDX[t * 3 + 2] * 3;
    const d = (P[b + 1] - P[c + 1]) * (P[a] - P[c]) + (P[c] - P[b]) * (P[a + 1] - P[c + 1]); if (Math.abs(d) < 1e-12) return;
    const l1 = ((P[b + 1] - P[c + 1]) * (x - P[c]) + (P[c] - P[b]) * (y - P[c + 1])) / d;
    const l2 = ((P[c + 1] - P[a + 1]) * (x - P[c]) + (P[a] - P[c]) * (y - P[c + 1])) / d, l3 = 1 - l1 - l2;
    if (l1 < -1e-6 || l2 < -1e-6 || l3 < -1e-6) return;
    const z = l1 * P[a + 2] + l2 * P[b + 2] + l3 * P[c + 2];
    if (z <= zTop && z >= zBot && z > best) best = z;
  });
  return best;
}
// floor under a small disc (bridges the scan's pinholes)
function groundAt(x, y, zTop, zBot) {
  let best = floorAt(x, y, zTop, zBot);
  for (const [dx, dy] of [[0.12, 0], [-0.12, 0], [0, 0.12], [0, -0.12]]) best = Math.max(best, floorAt(x + dx, y + dy, zTop, zBot));
  return best;
}
// closest point on triangle (Ericson, Real-Time Collision Detection 5.1.5)
function closest(px, py, pz, t, out) {
  const a = IDX[t * 3] * 3, b = IDX[t * 3 + 1] * 3, c = IDX[t * 3 + 2] * 3;
  const ax = P[a], ay = P[a + 1], az = P[a + 2];
  const abx = P[b] - ax, aby = P[b + 1] - ay, abz = P[b + 2] - az, acx = P[c] - ax, acy = P[c + 1] - ay, acz = P[c + 2] - az;
  const apx = px - ax, apy = py - ay, apz = pz - az;
  const d1 = abx * apx + aby * apy + abz * apz, d2 = acx * apx + acy * apy + acz * apz;
  if (d1 <= 0 && d2 <= 0) return set(out, ax, ay, az);
  const bpx = px - P[b], bpy = py - P[b + 1], bpz = pz - P[b + 2];
  const d3 = abx * bpx + aby * bpy + abz * bpz, d4 = acx * bpx + acy * bpy + acz * bpz;
  if (d3 >= 0 && d4 <= d3) return set(out, P[b], P[b + 1], P[b + 2]);
  const vc = d1 * d4 - d3 * d2;
  if (vc <= 0 && d1 >= 0 && d3 <= 0) { const v = d1 / (d1 - d3); return set(out, ax + v * abx, ay + v * aby, az + v * abz); }
  const cpx = px - P[c], cpy = py - P[c + 1], cpz = pz - P[c + 2];
  const d5 = abx * cpx + aby * cpy + abz * cpz, d6 = acx * cpx + acy * cpy + acz * cpz;
  if (d6 >= 0 && d5 <= d6) return set(out, P[c], P[c + 1], P[c + 2]);
  const vb = d5 * d2 - d1 * d6;
  if (vb <= 0 && d2 >= 0 && d6 <= 0) { const w = d2 / (d2 - d6); return set(out, ax + w * acx, ay + w * acy, az + w * acz); }
  const va = d3 * d6 - d5 * d4;
  if (va <= 0 && d4 - d3 >= 0 && d5 - d6 >= 0) { const w = (d4 - d3) / ((d4 - d3) + (d5 - d6));
    return set(out, P[b] + w * (P[c] - P[b]), P[b + 1] + w * (P[c + 1] - P[b + 1]), P[b + 2] + w * (P[c + 2] - P[b + 2])); }
  const den = 1 / (va + vb + vc), v = vb * den, w = vc * den;
  return set(out, ax + abx * v + acx * w, ay + aby * v + acy * w, az + abz * v + acz * w);
}
function set(o, x, y, z) { o[0] = x; o[1] = y; o[2] = z; return o; }
const tmp = [0, 0, 0];
// push the player's body spheres horizontally out of walls and furniture
function pushOut(feet) {
  for (let it = 0; it < 4; it++) {
    let moved = false;
    for (const h of SPHERES) {
      const cx = feet.x, cy = feet.y, cz = feet.z + h;
      let px = 0, py = 0;
      eachTri(cx - RADIUS, cx + RADIUS, cy - RADIUS, cy + RADIUS, t => {
        closest(cx + px, cy + py, cz, t, tmp);
        const dx = cx + px - tmp[0], dy = cy + py - tmp[1], dz = cz - tmp[2], d = Math.hypot(dx, dy, dz);
        if (d >= RADIUS) return;
        const hl = Math.hypot(dx, dy); if (hl < 1e-4) return;        // straight above/below: floor or ceiling, not a wall
        const k = Math.min(RADIUS - d, 0.2) / hl; px += dx * k; py += dy * k;
      });
      if (px || py) { feet.x += px; feet.y += py; moved = true; }
    }
    if (!moved) break;
  }
}

// ------------------------------------------------------------------ scan spots + photo view
const spots = (meta.spots || []).map((s, i) => ({ ...s, i, pos: new THREE.Vector3(...s.position), align: null, tex: null, loading: null }));
const photoMat = new THREE.ShaderMaterial({
  uniforms: { pano: { value: null }, ym: { value: new THREE.Vector2() }, opacity: { value: 0 } },
  side: THREE.BackSide, transparent: true, depthTest: false, depthWrite: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `#define PI 3.14159265
    uniform sampler2D pano; uniform vec2 ym; uniform float opacity; varying vec3 vDir;
    void main(){
      vec3 u = normalize(vDir);
      float lon = mod((atan(u.y, u.x) - ym.x) * ym.y + PI, 2. * PI) - PI, lat = asin(clamp(u.z, -1., 1.));
      vec2 uv = vec2((lon + PI) / (2. * PI), (lat + PI / 2.) / PI);
      vec2 dx = dFdx(uv), dy = dFdy(uv); dx.x -= floor(dx.x + .5); dy.x -= floor(dy.x + .5);
      gl_FragColor = vec4(textureGrad(pano, uv, dx, dy).rgb, opacity);
      #include <colorspace_fragment>
    }`,
});
const photo = new THREE.Mesh(new THREE.SphereGeometry(5, 64, 32), photoMat);
photo.renderOrder = 10; photo.visible = false; photo.frustumCulled = false; scene.add(photo);

// Match a panorama's heading to the mesh: render the mesh as a 360 from the scan spot, compare edge images at every
// rotation. (The stored headings are off by 10-180 degrees for some spots, so they are only used as a fallback.)
const EW = 512, EH = 256;
const eqMat = new THREE.ShaderMaterial({ uniforms: { cube: { value: null } }, depthTest: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `#define PI 3.14159265
    uniform samplerCube cube; varying vec2 vUv;
    void main(){ float th = vUv.x * 2. * PI - PI, la = vUv.y * PI - PI / 2.;
      gl_FragColor = textureCube(cube, vec3(cos(la) * cos(th), cos(la) * sin(th), sin(la))); }` });
const quad = new THREE.Scene(); quad.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), eqMat));
const orth = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
function edges(px) {                                  // RGBA rows top-down -> zero-mean gradient magnitude
  const g = new Float32Array(EW * EH), G = new Float32Array(EW * EH); let mean = 0;
  for (let i = 0; i < EW * EH; i++) g[i] = px[i * 4] + px[i * 4 + 1] + px[i * 4 + 2];
  for (let y = 1; y < EH - 1; y++) for (let x = 0; x < EW; x++) {
    const gx = g[y * EW + (x + 1) % EW] - g[y * EW + (x + EW - 1) % EW], gy = g[(y + 1) * EW + x] - g[(y - 1) * EW + x];
    mean += G[y * EW + x] = Math.hypot(gx, gy); }
  mean /= EW * EH; for (let i = 0; i < EW * EH; i++) G[i] -= mean; return G;
}
function alignSpot(s, img) {
  const rt = new THREE.WebGLCubeRenderTarget(512); const cc = new THREE.CubeCamera(0.05, 60, rt); cc.position.copy(s.pos);
  photo.visible = false; cc.update(renderer, scene);
  eqMat.uniforms.cube.value = rt.texture;
  const eq = new THREE.WebGLRenderTarget(EW, EH); renderer.setRenderTarget(eq); renderer.render(quad, orth); renderer.setRenderTarget(null);
  const raw = new Uint8Array(EW * EH * 4), flip = new Uint8Array(EW * EH * 4); renderer.readRenderTargetPixels(eq, 0, 0, EW, EH, raw);
  for (let y = 0; y < EH; y++) flip.set(raw.subarray((EH - 1 - y) * EW * 4, (EH - y) * EW * 4), y * EW * 4);
  rt.dispose(); eq.dispose();

  const Gr = edges(flip), Gp = edges(cx.getImageData(0, 0, EW, EH).data);

    for (let c = 0; c < EW; c++) { let t = (sh + m * c) % EW; if (t < 0) t += EW; sc += Gp[r + c] * Gr[r + t]; } } return sc; };

}
function prepareSpot(s) {

    .then(img => {
      if (!img) return;

      s.tex = t;

    });

// ------------------------------------------------------------------ player
const feet = new THREE.Vector3(), vel = new THREE.Vector2(), eye = new THREE.Vector3();

function placeAt(s, keepView) {

  eye.set(feet.x, feet.y, feet.z + EYE);

const start = spots[0] || { pos: new THREE.Vector3((meta.bbox[0][0] + meta.bbox[1][0]) / 2, (meta.bbox[0][1] + meta.bbox[1][1]) / 2, meta.bbox[0][2] + 3) };
placeAt(start, true);

const keys = new Set();
addEventListener('keydown', e => {
  if (e.repeat) return; keys.add(e.code);
  if (e.code === 'KeyN' || e.code === 'KeyB') jump(e.code === 'KeyN' ? 1 : -1);
  if (e.code === 'KeyP') { autoPhoto = !autoPhoto; hint(autoPhoto ? 'Photo view on: stop at a scan spot to see the photo' : 'Photo view off'); setTimeout(() => hint(''), 1600); if (!autoPhoto) leavePhoto(); }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
const cv = renderer.domElement;
let dragging = false;
cv.addEventListener('mousedown', () => { if (document.pointerLockElement !== cv) { cv.requestPointerLock?.()?.catch?.(() => {}); dragging = true; } });
addEventListener('mouseup', () => dragging = false);
addEventListener('mousemove', e => {
  if (document.pointerLockElement !== cv && !dragging) return;
  yaw -= e.movementX * 0.0022; pitch = Math.max(-1.45, Math.min(1.45, pitch - e.movementY * 0.0022));
});
let spotIdx = 0;
function jump(d) {
  if (!spots.length) return;
  spotIdx = (spotIdx + d + spots.length) % spots.length;
  const s = spots[spotIdx]; $('fade').style.opacity = 1; leavePhoto(true);
  setTimeout(() => { placeAt(s, true); $('fade').style.opacity = 0; }, 260);
}
function leavePhoto(now) { if (mode === 'walk') return; mode = 'walk'; glide = null; if (now) { fadeT = 0; photo.visible = false; } }

function nearestSpot(maxD) {
  let best = null, bd = maxD;
  for (const s of spots) { const d = Math.hypot(s.pos.x - feet.x, s.pos.y - feet.y);
    if (d < bd && Math.abs(s.pos.z - (feet.z + 1.3)) < 0.9) { bd = d; best = s; } }
  return best;
}

// ------------------------------------------------------------------ loop
const clock = new THREE.Clock();
let lodTimer = 0, prefetchTimer = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const fwd = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
  const side = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  const moving = fwd || side;
  if (moving && mode !== 'walk') leavePhoto();

  if (mode === 'walk') {
    const sp = keys.has('ShiftLeft') || keys.has('ShiftRight') ? RUN : WALK;
    let wx = 0, wy = 0;
    if (moving) { const l = Math.hypot(fwd, side); const f = fwd / l, s = side / l;
      wx = (Math.cos(yaw) * f + Math.sin(yaw) * s) * sp; wy = (Math.sin(yaw) * f - Math.cos(yaw) * s) * sp; }
    const k = 1 - Math.exp(-dt * (moving ? 9 : 12));
    vel.x += (wx - vel.x) * k; vel.y += (wy - vel.y) * k;
    const steps = Math.max(1, Math.ceil(Math.hypot(vel.x, vel.y) * dt / 0.08));
    for (let i = 0; i < steps; i++) {
      const ox = feet.x, oy = feet.y;
      feet.x += vel.x * dt / steps; feet.y += vel.y * dt / steps;
      pushOut(feet);
      const g = groundAt(feet.x, feet.y, feet.z + STEP, feet.z - 3);
      if (!isFinite(g)) { feet.x = ox; feet.y = oy; vel.multiplyScalar(0.5); continue; }   // no floor there (hole / outside)
      if (g >= feet.z - 0.02) { feet.z = g; vz = 0; }                                      // flat or a step up
      else { vz -= 9.8 * dt / steps; feet.z = Math.max(g, feet.z + vz * dt / steps); if (feet.z === g) vz = 0; }
    }
    const target = new THREE.Vector3(feet.x, feet.y, feet.z + EYE);
    eye.x = target.x; eye.y = target.y; eye.z += (target.z - eye.z) * (1 - Math.exp(-dt * 10));   // stairs feel smooth
    idle = moving || Math.hypot(vel.x, vel.y) > 0.05 ? 0 : idle + dt;

    if (autoPhoto && idle > IDLE_S) {
      const s = nearestSpot(PHOTO_DIST);
      if (s && s.tex && s.align) { mode = 'glide'; active = s; glide = { from: eye.clone(), t: 0 };
        photoMat.uniforms.pano.value = s.tex; photoMat.uniforms.ym.value.set(s.align.yaw, s.align.mirror); }
    }
  } else if (mode === 'glide' || mode === 'photo') {
    glide.t = Math.min(1, glide.t + dt / 0.6);
    const e = glide.t * glide.t * (3 - 2 * glide.t);
    eye.lerpVectors(glide.from, active.pos, e);
    if (glide.t >= 1) mode = 'photo';
  }
  // photo cross-fade
  fadeT = mode === 'photo' ? Math.min(1, fadeT + dt / 0.5) : Math.max(0, fadeT - dt / 0.25);
  photo.visible = fadeT > 0; photoMat.uniforms.opacity.value = fadeT; if (active) photo.position.copy(active.pos);
  if (mode === 'walk' && fadeT === 0) active = null;

  camera.position.copy(eye);
  camera.lookAt(eye.x + Math.cos(pitch) * Math.cos(yaw), eye.y + Math.cos(pitch) * Math.sin(yaw), eye.z + Math.sin(pitch));
  renderer.render(scene, camera);

  lodTimer += dt; if (lodTimer > 1) { lodTimer = 0; updateLOD(); }
  prefetchTimer += dt;
  if (prefetchTimer > 0.5) { prefetchTimer = 0;
    const s = nearestSpot(2.5); if (s && !s.loading) prepareSpot(s);
    const near = nearestSpot(PHOTO_DIST);
    status(`${mode === 'photo' ? 'Photo at scan spot ' + active.label : 'Walking'} · ${spots.length} scan spots` +
      (near && !near.tex ? ' · loading photo…' : '') + (near && near.tex && !near.align ? ' · this photo could not be lined up' : ''));
    hint(mode === 'photo' ? 'Real photo - move to keep walking' : (near && autoPhoto && near.tex && near.align && idle < IDLE_S && !moving ? 'Stand still to see the photo' : ''));
  }
  requestAnimationFrame(frame);
}
status(`Ready · ${spots.length} scan spots`);
window.walk = { feet, eye, spots, get mode() { return mode; }, setView(y, p) { yaw = y; pitch = p; }, keys };   // for debugging
frame();
</script>
</body>
</html>
