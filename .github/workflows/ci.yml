name: ci

on:
  pull_request:
  push:
    branches: [main, integration/mvp]

permissions:
  contents: read

jobs:
  data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      # Synthetic fixtures only; no sponsor data or secrets.
      - run: python -m pytest data/tests -q

  foreground-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foreground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: foreground/package-lock.json
      - run: npm ci
      - run: npm run build
