name: ci

on:
  pull_request:
  push:
    branches: [main, integration/mvp]

permissions:
  contents: read

jobs:
  data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      # Synthetic fixtures only; no sponsor data or secrets.
      - run: python -m pytest data/tests -q

  api-and-modeling-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest -r services/api/requirements.txt -r modeling/requirements.txt
      - run: python -m pytest services/api -q
      # Inspection slice (inspection/ package + /inspection route); fixture mode, no API key.
      - run: python -m pytest services/api/tests/test_inspection.py -q
      - run: python -m pytest modeling -q
      # Inspection anchoring/hotspots/bundle glue and the capture pipeline's pure-numpy tests (no GPU, no weights).
      - run: python -m pip install numpy scipy pillow opencv-python-headless
      - run: python -m pytest inspection capture -q
      # Asset catalog (core/variants/GLB) and ingest (mocked vision client, fixture mode; no API key).
      - run: python -m pip install pillow anthropic python-dotenv
      - run: python -m pytest services/api/tests/test_assets.py services/api/tests/test_assets_ingest.py -q

  model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r forecasting/requirements.txt
      # Synthetic fixtures only; no sponsor data or secrets.
      - run: python -m pytest forecasting -q
      - run: python -m pytest -c planning/pytest.ini planning -q
      - run: python -m pytest integration -q

  foreground-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foreground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: foreground/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint

  walkthrough-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: walkthrough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: walkthrough/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
