name: census-acs-fetch

# Manual only. Pulls public ACS 5-year tract tables for Texas and California using
# the repository secret CENSUS_API_KEY, then uploads them as an artifact. It never
# touches site data. Download locally with: gh run download <id> -n acs-tracts
on:
  workflow_dispatch:
    inputs:
      vintage:
        description: ACS 5-year vintage (e.g. 2023)
        default: "2023"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch tract tables
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          VINTAGE: ${{ inputs.vintage }}
        run: |
          set -euo pipefail
          mkdir -p out
          vars="NAME,B19013_001E,B19013_001M,B01003_001E,B01003_001M,B01002_001E,B01002_001M"
          for fips in 48 06; do
            curl -fsS --retry 3 --max-time 120 \
              "https://api.census.gov/data/${VINTAGE}/acs/acs5?get=${vars}&for=tract:*&in=state:${fips}&key=${CENSUS_API_KEY}" \
              -o "out/acs5_${VINTAGE}_tracts_state${fips}.json"
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(sys.argv[1], len(d)-1, 'tracts')" "out/acs5_${VINTAGE}_tracts_state${fips}.json"
          done
          printf '{"source":"US Census Bureau ACS 5-year","vintage":"%s","retrieved":"%s"}\n' "$VINTAGE" "$(date -u +%FT%TZ)" > out/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: acs-tracts
          path: out/
          retention-days: 14
